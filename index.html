<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>것모닝 시상 룰렛</title>
<meta name="description" content="2026 것모닝코리아 팀 챌린지 Dream US 시상 추첨">
<meta name="theme-color" content="#EEFBF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="것모닝 시상">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap">
<style>
  :root {
    color-scheme: light;
    --green: #1E9E4A;
    --green-deep: #137A36;
    --green-ink: #0F5A28;
    --mint: #EEFBF1;
    --mint-2: #DDF5E3;
    --line: #C9EBD3;
    --orange: #F59E1B;
    --sun: #FFB81F;
    --blue: #2F6FD6;
    --paper: #FFFFFF;
    --ink: #1F3326;
    --ink-soft: #5D7465;
    --scrim: rgba(12, 48, 24, .55);
    --body: "Gamja Flower", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --logo: "Fredoka", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  textarea::placeholder { color: var(--ink-soft); }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--mint); color: var(--ink);
    font: 20px/1.4 var(--body);
    padding-inline: 16px;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    background-image: radial-gradient(900px 500px at 15% -10%, #FFFFFF 0%, transparent 60%);
  }
  .app { max-width: 1680px; margin: 0 auto; min-height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 14px; padding-block: 14px; }
  @media (min-width: 901px) { .app { height: 100vh; height: 100dvh; } .stage, .board { overflow: hidden; } }

  /* header */
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 14px; margin-right: auto; }
  .brand svg { width: 80px; height: 68px; flex: none; }
  .brand .wm { display: block; height: 38px; width: auto; margin-bottom: 4px; }
  .brand .sub { font-size: 20px; color: var(--ink-soft); }
  .brand .sub b { color: var(--green); font-weight: 400; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: 2px solid var(--line); background: var(--paper); color: var(--ink);
    font: 20px var(--body); padding: 6px 16px; border-radius: 999px; cursor: pointer;
  }
  .btn:hover { border-color: var(--green); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.orange { background: var(--orange); border-color: var(--orange); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  #music[aria-pressed="false"] { opacity: .55; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

  /* main */
  main { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 18px; min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .stage {
    background: var(--paper); border-radius: 28px; border: 2px solid var(--line);
    display: grid; grid-template-rows: auto 1fr auto; gap: 10px; padding: 16px 18px; min-height: 0;
  }
  .stage-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .now { font-size: 22px; color: var(--ink-soft); }
  .now b { color: var(--green-deep); font-weight: 400; font-size: 28px; }
  .seg { display: flex; background: var(--mint); border-radius: 999px; padding: 4px; gap: 4px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--ink-soft); white-space: nowrap; }
  .seg input:checked + label { background: var(--green); color: #fff; }
  .seg input:focus-visible + label { outline: 3px solid var(--orange); }

  .arena { position: relative; display: grid; place-items: center; min-height: 0; container-type: size; }
  @media (max-width: 900px) { .arena { min-height: 520px; } }
  .wheel-box { position: relative; width: min(100%, 64vh, 640px); width: min(100cqw, 96cqh, 700px); aspect-ratio: 1; container-type: inline-size; }
  .wheel-box canvas { width: 100%; height: 100%; display: block; }
  .pointer {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%); z-index: 2;
    width: 0; height: 0; border-left: 22px solid transparent; border-right: 22px solid transparent;
    border-top: 40px solid var(--green-ink); filter: drop-shadow(0 3px 3px rgba(0,0,0,.25));
  }
  .hub {
    position: absolute; inset: 0; margin: auto; width: 22%; height: 22%; border-radius: 50%;
    background: #fff; border: 5px solid var(--orange); color: var(--green-deep);
    font: clamp(20px, 2.4vw, 32px) var(--body); cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.15);
    font-size: min(6cqi, 34px); border-width: max(3px, .8cqi); padding: 0; line-height: 1; white-space: nowrap;
  }
  .hub:disabled { cursor: default; }
  .callout {
    position: absolute; left: 50%; top: 8%; transform: translateX(-50%); z-index: 3;
    background: var(--orange); color: #fff; padding: 10px 34px; border-radius: 999px;
    font-size: clamp(34px, 4.4vw, 60px); font-size: clamp(24px, 9cqi, 64px); padding: .15em .6em; max-width: 96cqi; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.2);
    animation: pop .4s cubic-bezier(.2,1.5,.4,1);
  }

  /* shuffle / auto stage */
  .slot {
    width: min(100%, 720px); display: grid; gap: 18px; justify-items: center; text-align: center;
  }
  .slot { gap: 2.4cqh; }
  .slot .prize-big { font-size: clamp(24px, 7cqh, 46px); color: var(--green-deep); line-height: 1.1; }
  .slot .reel {
    width: 100%; border-radius: 30px; background: var(--mint); border: 4px dashed var(--line);
    padding: 4cqh 20px; font-size: clamp(40px, min(8vw, 15cqh), 120px); line-height: 1.1; color: var(--ink);
    min-height: 1.5em; font-variant-numeric: tabular-nums;
  }
  .slot .reel.done { background: var(--orange); border: 4px solid var(--orange); color: #fff; animation: pop .45s cubic-bezier(.2,1.5,.4,1); }
  .slot .hint { color: var(--ink-soft); }

  .go-row { display: flex; justify-content: center; gap: 10px; }
  .go { font-size: 30px; padding: 10px 48px; }

  /* prizes */
  .board {
    background: var(--paper); border-radius: 28px; border: 2px solid var(--line);
    display: grid; grid-template-rows: auto auto 1fr; gap: 12px; padding: 16px 18px; min-height: 0;
  }
  .rounds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .round {
    border: 2px solid var(--line); background: var(--mint); border-radius: 18px; padding: 8px 14px;
    cursor: pointer; text-align: left; font: 24px var(--body); color: var(--ink);
  }
  .round small { display: block; font-size: 17px; color: var(--ink-soft); }
  .round[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  .round[aria-pressed="true"] small { color: #DDF5E3; }
  .pool { font-size: 18px; color: var(--ink-soft); }
  .pool b { color: var(--green-deep); font-weight: 400; }
  .prizes { display: grid; gap: 10px; overflow-y: auto; min-height: 0; padding-right: 4px; align-content: start; }
  .prize {
    border: 2px solid var(--line); border-radius: 20px; padding: 10px 14px; cursor: pointer; background: #fff;
    display: grid; gap: 8px; text-align: left; font: inherit; color: inherit; width: 100%;
  }
  .prize:hover { border-color: var(--green); }
  .prize.sel { border-color: var(--orange); box-shadow: 0 0 0 3px #FFE3B3; }
  .prize.full { background: var(--mint); }
  .prize .ph { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .prize .pn { font-size: 28px; color: var(--green-ink); }
  .prize .pc { font-size: 20px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .prize .pc b { color: var(--orange); font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    min-width: 72px; padding: 2px 10px; border-radius: 10px; font-size: 19px; text-align: center;
    border: 2px dashed var(--line); color: transparent;
  }
  .chip.on { border: 2px solid var(--green); background: var(--mint-2); color: var(--green-ink); }
  .chip.new { animation: pop .4s cubic-bezier(.2,1.5,.4,1); background: #FFE7BF; border-color: var(--orange); }

  /* ① 상품 카드: 사진 */
  .prize .top { display: flex; align-items: center; gap: 12px; }
  .prize .thumb { width: 74px; height: 62px; flex: none; border-radius: 12px; background: #fff; border: 1px solid var(--line); object-fit: contain; padding: 3px; }
  .prize .ph { flex: 1; display: block; }
  .prize .full-name { font-size: 16px; color: var(--ink-soft); line-height: 1.2; }

  /* ② 상품 공개: 무대 가운데 "짠!" */
  .reveal {
    position: absolute; inset: 0; z-index: 5; border-radius: 22px; overflow: hidden; cursor: pointer;
    display: grid; place-items: center; text-align: center; background: var(--mint);
  }
  .reveal::before {
    content: ""; position: absolute; inset: -50%;
    background: repeating-conic-gradient(from 0deg, #FFF3D1 0 10deg, #EEFBF1 10deg 20deg);
    animation: spinrays 18s linear infinite;
  }
  .reveal::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.95) 0 22%, rgba(255,255,255,0) 60%); }
  .reveal .in { position: relative; z-index: 1; display: grid; gap: 1.6cqh; justify-items: center; padding-block: 5cqh; max-height: 100%; animation: rise .7s cubic-bezier(.2,1.4,.4,1); }
  .reveal .tag { background: var(--green); color: #fff; padding: .15em .8em; border-radius: 999px; font-size: clamp(18px, 4.4cqh, 26px); }
  .reveal img { height: 40cqh; max-width: 80cqw; object-fit: contain; border-radius: 22px; background: #fff; padding: 1.6cqh; box-shadow: 0 16px 34px rgba(0,0,0,.14); }
  .reveal .nm { font-size: clamp(30px, 10cqh, 68px); color: var(--green-ink); line-height: 1.05; }
  .reveal .sub { font-size: clamp(16px, 3.6cqh, 24px); color: var(--ink-soft); line-height: 1.2; }
  .reveal .cnt { font-size: clamp(20px, 5.4cqh, 34px); color: var(--orange); line-height: 1.2; }
  @keyframes spinrays { to { transform: rotate(360deg); } }
  @keyframes rise { from { transform: translateY(40px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }

  /* 이름 셔플 / 자동 화면에도 상품 사진 */
  .slot .slot-img { height: min(22vh, 200px); height: min(24cqh, 200px); max-width: 60%; object-fit: contain; }

  /* ③ 당첨 카드 */
  .win {
    position: relative; width: min(100%, 760px); max-height: 92vh; overflow: auto; background: #fff; border-radius: 34px;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.35); animation: rise .6s cubic-bezier(.2,1.4,.4,1);
  }
  .win .pic { background: var(--mint); height: 100%; display: grid; place-items: center; padding: 26px; border-right: 4px dashed var(--line); }
  .win .pic img { width: 100%; max-height: min(300px, 40vh); object-fit: contain; }
  .win .txt { padding: 28px 30px; display: grid; gap: 6px; text-align: center; }
  .win .hey { font-size: 28px; color: var(--orange); }
  .win .who { font-size: clamp(48px, min(7vw, 11vh), 96px); line-height: 1.05; color: var(--green-ink); word-break: keep-all; }
  .win .what { font-size: 26px; color: var(--ink-soft); }
  .win .what b { color: var(--green-deep); font-weight: 400; }
  .win .btn { justify-self: center; margin-top: 8px; }
  .win .ribbon { position: absolute; top: 18px; left: -46px; transform: rotate(-35deg); background: var(--orange); color: #fff; padding: 4px 56px; font-size: 20px; }
  @media (max-width: 700px) { .win { grid-template-columns: 1fr; } .win .pic { border-right: 0; border-bottom: 4px dashed var(--line); } }

  /* dialogs */
  .overlay { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
  .dialog {
    background: #fff; border-radius: 26px; width: min(100%, 980px); max-height: 92vh; overflow: auto;
    padding: 22px 24px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .dialog h2 { margin: 0; font: 36px var(--body); color: var(--green-deep); font-weight: 400; }
  .dialog p { margin: 0; color: var(--ink-soft); }
  .dialog.names { width: min(100%, 1500px); }
  .ng { display: grid; gap: 8px; border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; }
  .ng h3 { margin: 0; font: 26px var(--body); color: var(--green-ink); font-weight: 400; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ng h3 small { font-size: 18px; color: var(--ink-soft); }
  .ng h3 b { margin-left: auto; color: var(--orange); font-weight: 400; font-size: 26px; }
  .grid10 { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
  @media (max-width: 900px) { .grid10 { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .cell { position: relative; display: flex; align-items: center; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
  .cell:focus-within { border-color: var(--green); }
  .cell .no { position: absolute; top: -9px; left: 6px; background: #fff; padding: 0 3px; font-size: 13px; line-height: 1; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .cell input { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 19px var(--body); padding: 7px 2px 5px 8px; outline: none; }
  .cell .x { flex: none; width: 24px; height: 24px; margin-right: 4px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-soft); font-size: 18px; line-height: 1; cursor: pointer; }
  .cell .x:hover { background: #FFE3B3; color: #B5560C; }
  .ng .add { display: flex; gap: 8px; }
  .ng .add input { flex: 1; max-width: 360px; border: 2px dashed var(--line); border-radius: 10px; background: #fff; color: var(--ink); font: 19px var(--body); padding: 6px 10px; }
  .ng .add input:focus { outline: none; border-color: var(--green); border-style: solid; }
  .paste { border: 2px dashed var(--line); border-radius: 18px; padding: 10px 14px; display: grid; gap: 10px; }
  .paste summary { cursor: pointer; color: var(--green-deep); font-size: 20px; }
  .paste[open] { gap: 10px; }
  .dialog textarea {
    width: 100%; min-height: 220px; font: 20px/1.5 var(--body); padding: 12px 14px;
    border: 2px solid var(--line); border-radius: 14px; resize: vertical; color: var(--ink);
    background: #FFFFFF; caret-color: var(--green-deep);
  }
  .dialog .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }
  .dialog .count { margin-right: auto; color: var(--green-deep); }
  .results { display: grid; gap: 16px; }
  .results section { display: grid; gap: 8px; }
  .results h3 { margin: 0; font: 30px var(--body); color: var(--green-ink); font-weight: 400; }
  .results h3 small { font-size: 20px; color: var(--ink-soft); }
  .results h4 { margin: 0; font: 24px var(--body); color: var(--orange); font-weight: 400; }
  .results .names { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 22px; }
  .confirm { width: min(100%, 460px); text-align: center; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; width: 100%; height: 100%; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .callout { animation-name: pop2; }
  @keyframes pop2 { from { transform: translateX(-50%) scale(.6); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .callout, .chip.new, .slot .reel.done { animation: none; } }

  /* 높이가 낮은 화면(갤럭시 탭·노트북 가로): 위쪽을 한 줄로 줄이고 원판 자리를 넓힌다 */
  @media (max-height: 820px) and (min-width: 901px) {
    .app { gap: 8px; padding-block: 8px; }
    header { flex-wrap: nowrap; gap: 10px; }
    .brand { gap: 10px; min-width: 0; }
    .brand svg { width: 52px; height: 44px; }
    .brand .wm { height: 26px; margin-bottom: 2px; }
    .brand .sub { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tools { flex-wrap: nowrap; gap: 6px; }
    .tools .btn { font-size: 16px; padding: 4px 10px; white-space: nowrap; }
    .stage, .board { padding: 10px 12px; gap: 6px; border-radius: 22px; }
    .now { font-size: 18px; } .now b { font-size: 22px; }
    .seg label { padding: 4px 10px; font-size: 17px; }
    .go { font-size: 24px; padding: 6px 36px; }
    .round { font-size: 20px; padding: 6px 12px; } .round small { font-size: 15px; }
    .prize .pn { font-size: 23px; } .prize .thumb { width: 60px; height: 50px; }
  }
  @media (max-height: 820px) and (min-width: 901px) and (max-width: 1200px) {
    .brand .sub { display: none; }
  }
</style>
</head>

<div class="app">
  <header>
    <div class="brand">
      <!-- gut morning 로고 (gutmorning.co.kr 원본) -->

// ---------- 상태 ----------
const KEY = "gutmorning-award-v2";
let state;
function load() {
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !state.text) state = { text: SAMPLE, round: 1, prize: "p1", winners: {}, log: [] };
  state.winners = state.winners || {}; state.log = state.log || [];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function parseNames(text) {
  const g1 = [], g2 = []; let cur = g1;
  text.split("\n").map(s => s.trim()).filter(Boolean).forEach(line => {
    if (/^\[.*\]$/.test(line)) { cur = /2차/.test(line) ? g2 : g1; return; }
    if (!g1.includes(line) && !g2.includes(line)) cur.push(line);
  });
  return { g1, g2 };
}
let people = { g1: [], g2: [] };
const eligible = round => round === 1 ? people.g1 : people.g1.concat(people.g2);
const prizeById = id => PRIZES.find(p => p.id === id);
const winnersOf = id => state.winners[id] || [];
// 같은 차수 안에서는 한 번만 당첨 (1차 당첨자도 2차에는 다시 참여)
function pool(round) {
  const won = new Set(PRIZES.filter(p => p.round === round).flatMap(p => winnersOf(p.id)));
  return eligible(round).filter(n => !won.has(n));
}
const left = p => p.count - winnersOf(p.id).length;

// ---------- 원판 ----------
const wheel = $("wheel"), ctx = wheel.getContext("2d");
const WHEEL_COLORS = ["#2DB35C", "#FFC93C", "#7FD49A", "#F59E1B", "#BFEBCB", "#8EC5FF", "#1E9E4A", "#FFE08A"];
let size = 0, rotation = 0, names = [];
function resizeWheel() {
  const b = wheel.parentElement.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  size = b.width; wheel.width = size * dpr; wheel.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); drawWheel();
}
function inkOn(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) < 150 ? "#FFFFFF" : "#1F3326";
}
function drawWheel() {
  if (size < 40) return;
  const c = size / 2, r = c - 10;
  ctx.clearRect(0, 0, size, size);
  ctx.beginPath(); ctx.arc(c, c, r + 8, 0, TAU); ctx.fillStyle = "#F59E1B"; ctx.fill();
  const n = names.length;
  if (!n) { ctx.beginPath(); ctx.arc(c, c, r, 0, TAU); ctx.fillStyle = "#EEFBF1"; ctx.fill(); return; }
  const seg = TAU / n;
  ctx.save(); ctx.translate(c, c); ctx.rotate(rotation);
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI / 2 + i * seg;
    let col = WHEEL_COLORS[i % WHEEL_COLORS.length];
    if (i === n - 1 && n % WHEEL_COLORS.length === 1) col = WHEEL_COLORS[3];
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a0, a0 + seg); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = n > 40 ? 1 : 2; ctx.stroke();
    const fs = Math.max(10, Math.min(26, seg * r * 0.62));
    ctx.save(); ctx.rotate(a0 + seg / 2);
    ctx.fillStyle = inkOn(col); ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.font = `${fs}px "Gamja Flower", sans-serif`;
    let t = names[i];
    while (t.length > 1 && ctx.measureText(t).width > r * 0.66) t = t.slice(0, -1);
    ctx.fillText(t === names[i] ? t : t + "…", r - 12, 0);
    ctx.restore();
  }
  ctx.restore();
}
const idxAt = rot => Math.floor((((-rot) % TAU + TAU) % TAU) / (TAU / names.length)) % names.length;

// ---------- 소리 ----------
let audio = null;
function beep(f = 900, d = .04, v = .1) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(v, audio.currentTime); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + d);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + d);
  } catch (e) {}
}
const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .22, .13), i * 110));

// ---------- 긴장감 음악 (앱이 직접 연주: 음원 파일 없음) ----------
// groove = 쿵쿵 박자 + 베이스, roll = 심장 소리 + 점점 커지는 드럼롤
const Music = (() => {
  let ac, out, noise, timer = 0, mode = null, step = 0, next = 0, level = 0, bpm = 132;
  let on = true;
  try { on = localStorage.getItem("gm-music") !== "off"; } catch (e) {}
  function init() {
    ac = ac || audio || new (window.AudioContext || window.webkitAudioContext)();
    audio = ac;
    if (!out) { out = ac.createGain(); out.gain.value = .55; out.connect(ac.destination); }
    if (!noise) {
      noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    try { ac.resume(); } catch (e) {}
  }
  function env(g, t, v, dur) { g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur); }
  function kick(t, v = .9) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
    env(g, t, v, .32); o.connect(g).connect(out); o.start(t); o.stop(t + .35);
  }
  function hiss(t, v, dur, type, freq) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; f.type = type; f.frequency.value = freq;
    env(g, t, v, dur); s.connect(f).connect(g).connect(out); s.start(t, Math.random()); s.stop(t + dur + .02);
  }
  const hat = (t, v) => hiss(t, v, .045, "highpass", 7000);
  const snare = (t, v) => hiss(t, v, .11, "bandpass", 1900);
  function bass(t, f, dur) {
    const o = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
    o.type = "sawtooth"; o.frequency.value = f; lp.type = "lowpass"; lp.frequency.value = 520;
    env(g, t, .22, dur); o.connect(lp).connect(g).connect(out); o.start(t); o.stop(t + dur + .02);
  }
  const BASS = [110, 0, 110, 130.8, 0, 110, 146.8, 130.8, 98, 0, 98, 110, 0, 98, 123.5, 110]; // A단조 느낌
  function schedule() {
    const sixteenth = 60 / bpm / 4;
    while (next < ac.currentTime + .12) {
      const s = step % 16;
      if (mode === "groove") {
        if (s % 4 === 0) kick(next);
        if (s === 4 || s === 12) snare(next, .35);
        if (s % 2 === 0) hat(next, .12); else hat(next, .05);
        if (BASS[s]) bass(next, BASS[s], sixteenth * 1.6);
      } else if (mode === "roll") {
        // 심장 소리 (쿵-쿵) + 갈수록 촘촘하고 커지는 드럼롤
        if (s === 0) kick(next, .8); if (s === 3) kick(next, .55);
        const dense = level > .55 ? 1 : 2;
        if (s % dense === 0) snare(next, .06 + level * .34);
        if (s % 8 === 0) bass(next, 55 * (1 + level * .5), sixteenth * 7);
      }
      next += sixteenth; step++;
    }
  }
  return {
    get on() { return on; },
    toggle() {
      on = !on; try { localStorage.setItem("gm-music", on ? "on" : "off"); } catch (e) {}
      if (!on) this.stop(false); return on;
    },
    play(m, tempo = 132) {
      if (!on) return; init();
      if (!timer) { next = ac.currentTime + .05; step = 0; timer = setInterval(schedule, 25); }
      mode = m; bpm = tempo;
    },
    level(v) { level = Math.max(0, Math.min(1, v)); },
    stop(crash = true) {
      clearInterval(timer); timer = 0; mode = null; level = 0;
      if (crash && on && ac) { const t = ac.currentTime + .02; hiss(t, .5, 1.8, "highpass", 3200); kick(t, 1); }
    }
  };
})();

// ---------- 추첨 ----------
let busy = false;
const method = () => document.querySelector('input[name="method"]:checked').value;
function current() { return prizeById(state.prize); }

function award(name, quiet) {
  const p = current();
  state.winners[p.id] = winnersOf(p.id).concat(name);
  state.log.push({ prize: p.id, name });
  save();
  lastNew = name;
  if (!quiet) { fanfare(); confetti(); setTimeout(() => showWin(name, p), method() === "wheel" ? 1300 : 700); }
}

  $("win-who").textContent = who;
  $("win-who").style.fontSize = who.length > 6 ? "clamp(40px, 5vw, 64px)" : "";

}
$("win-close").addEventListener("click", () => $("win-dlg").hidden = true);

// ② 상품 공개
function showReveal(p) {
  if (!p) return;
  $("rv-tag").textContent = `${p.round}차 추첨`;
  $("rv-img").src = IMG[p.img];
  $("rv-name").textContent = p.name;
  $("rv-sub").textContent = p.full;
  $("rv-cnt").textContent = left(p) > 0 ? `${left(p)}명을 뽑아요` : "추첨이 끝났어요";
  $("reveal").hidden = false; setGoText();
  [392, 523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .16, .09), i * 70)); // 짜잔
}
function hideReveal() { $("reveal").hidden = true; setGoText(); }
function setGoText() {
  const m = method();
  $("go").textContent = !$("reveal").hidden ? "🎉 추첨 시작!" : m === "auto" ? "⚡ 한 번에 뽑기" : m === "shuffle" ? "🎰 뽑기" : "🎡 돌리기";
}
$("reveal").addEventListener("click", hideReveal);

let lastNew = null;

function canDraw() {
  const p = current();
  if (!p || left(p) <= 0) { flash("이 상품은 다 뽑았어요. 다른 상품을 골라 주세요."); return false; }
  if (!pool(p.round).length) { flash("뽑을 사람이 남아 있지 않아요."); return false; }
  return true;
}

function spinWheel() {
  if (busy || !canDraw()) return;
  busy = true; lock(true); $("callout").hidden = true;
  try { audio && audio.resume(); } catch (e) {}
  const n = names.length, seg = TAU / n;
  const target = Math.floor(Math.random() * n);
  const want = (target + 0.2 + Math.random() * 0.6) * seg;
  const base = ((rotation % TAU) + TAU) % TAU;
  let delta = (TAU - want) % TAU - base; if (delta < 0) delta += TAU;
  const total = delta + TAU * (reduceMotion ? 1 : 6);
  // 5초 힘차게 → 6.5초 동안 엉금엉금 멈춤 (총 11초 남짓)
  const T1 = reduceMotion ? .5 : 5, T2 = reduceMotion ? .4 : 6.5, vc = 0.95;
  Music.play("groove", 132);
  const s2 = vc * T2 / 2, s1 = total - s2, v0 = vc + 3 * (s1 / T1 - vc);
  const start = rotation, t0 = performance.now(); let last = idxAt(rotation);
  const pos = t => t < T1
    ? T1 * (vc * (t / T1) + (v0 - vc) * (1 - Math.pow(1 - t / T1, 3)) / 3)
    : s1 + vc * T2 * (Math.min(1, (t - T1) / T2) - Math.min(1, (t - T1) / T2) ** 2 / 2);
  (function frame(now) {
    const t = (now - t0) / 1000;
    rotation = start + pos(t);
    const i = idxAt(rotation); if (i !== last) { beep(); last = i; }
    if (t >= T1) { Music.play("roll", 120); Music.level((t - T1) / T2); }
    drawWheel();
    if (t < T1 + T2) return requestAnimationFrame(frame);
    rotation = start + total; drawWheel(); Music.stop();
    const name = names[target];
    $("callout").textContent = name; $("callout").hidden = false;
    award(name); busy = false; lock(false); render();
  })(t0);
}

// 이름이 빠르게 바뀌다가 점점 느려져 한 명에서 멈춘다
function shuffleOne(names, final, ms, done) {
  const reel = $("reel"); reel.classList.remove("done");
  const t0 = performance.now(); let lastSwap = 0;
  (function frame(now) {
    const p = Math.min(1, (now - t0) / ms);
    const gap = 40 + 380 * p * p;              // 40ms → 420ms
    if (now - lastSwap > gap) {
      reel.textContent = names[Math.floor(Math.random() * names.length)];
      lastSwap = now; if (ms > 600) beep(700 + Math.random() * 300, .03, .06);
    }
    if (p < 1) return requestAnimationFrame(frame);
    reel.textContent = final; reel.classList.add("done"); done();
  })(t0);
}

function drawShuffle() {
  if (busy || !canDraw()) return;
  busy = true; lock(true);
  try { audio && audio.resume(); } catch (e) {}
  const p = current(), pl = pool(p.round);
  const final = pl[Math.floor(Math.random() * pl.length)];
  const ms = reduceMotion ? 300 : 5000;
  Music.play("roll", 120);
  const t0 = performance.now(), lv = setInterval(() => Music.level((performance.now() - t0) / ms), 100);
  shuffleOne(pl, final, ms, () => { clearInterval(lv); Music.stop(); award(final); busy = false; lock(false); render(); });
}

function drawAuto() {
  if (busy || !canDraw()) return;
  busy = true; lock(true);
  try { audio && audio.resume(); } catch (e) {}
  const p = current();
  Music.play("groove", 140);
  const step = () => {
    const pl = pool(p.round);
    if (left(p) <= 0 || !pl.length) {
      Music.stop(); busy = false; lock(false); fanfare(); confetti(); render();
      const n = winnersOf(p.id).length;
      setTimeout(() => showWin(`${n}명`, p, `${p.round}차 · ${p.name} 당첨자가<br>모두 정해졌어요`), 700);
      return;
    }
    const final = pl[Math.floor(Math.random() * pl.length)];
    // 많은 상품(칼맥디 미니 50개)은 한 명당 약 0.6초 → 50명 30초 남짓
    shuffleOne(pl, final, reduceMotion ? 60 : (p.count > 10 ? 460 : 900), () => {
      award(final, true); beep(1100, .06, .08); render();
      $("slot-hint").textContent = `남은 ${left(p)}자리`;
      setTimeout(step, p.count > 10 ? 140 : 300);
    });
  };
  step();
}

function go() {
  hideReveal();
  const m = method();
  if (m === "wheel") spinWheel(); else if (m === "shuffle") drawShuffle(); else drawAuto();
}

function lock(on) {
  ["go", "hub", "undo", "reset", "open-names", "r1", "r2"].forEach(id => $(id).disabled = on);
  document.querySelectorAll(".prize, .seg input").forEach(b => b.disabled = on);
}

let flashTimer = 0;
function flash(msg) {
  $("slot-hint").textContent = msg; $("now").dataset.msg = msg; renderNow();
  clearTimeout(flashTimer); flashTimer = setTimeout(() => { delete $("now").dataset.msg; renderNow(); $("slot-hint").textContent = hintText(); }, 2500);
}

// ---------- 화면 ----------
function hintText() {

  if (!p) return "";
  return method() === "auto" ? `남은 ${left(p)}자리를 한 번에 뽑아요` : `남은 자리 ${left(p)} / ${p.count}`;
}

    b.querySelector(".pn").textContent = x.name;

      const inp = document.createElement("input"); inp.value = name; inp.id = `nm-${g}-${i}`; inp.setAttribute("aria-label", `${i + 1}번 이름`);
      inp.addEventListener("input", () => { draft[g][i] = inp.value; countNames(); });
      const x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "×"; x.setAttribute("aria-label", `${name} 삭제`);
      x.addEventListener("click", () => { draft[g].splice(i, 1); renderNames(); });
      cell.append(no, inp, x); grid.appendChild(cell);
    });
  });
  countNames();
  if (focus) { const el = $(focus); if (el) el.focus(); }
}
function countNames() {
  const n1 = draft.g1.filter(s => s.trim()).length, n2 = draft.g2.filter(s => s.trim()).length;
  document.querySelector('#names-dlg .ng[data-g="g1"] .ng-n').textContent = `${n1}명`;
  document.querySelector('#names-dlg .ng[data-g="g2"] .ng-n').textContent = `${n2}명`;
  $("names-count").textContent = `1차 대상 ${n1}명 · 2차에만 ${n2}명 · 전체 ${n1 + n2}명`;
}
document.querySelectorAll("#names-dlg .ng").forEach(sec => {
  const g = sec.dataset.g, inp = sec.querySelector(".add input"), btn = sec.querySelector(".add button");
  const add = () => {
    const v = inp.value.trim(); if (!v) return;
    clean();
    if (draft.g1.includes(v) || draft.g2.includes(v)) { inp.value = ""; inp.placeholder = `'${v}'은(는) 이미 있어요`; return; }
    draft[g].push(v); inp.value = ""; inp.placeholder = "이름 입력 후 Enter"; renderNames(); inp.focus();
  };
  btn.addEventListener("click", add);
  inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); add(); } });
});
$("open-names").addEventListener("click", () => {
  draft = parseNames(state.text); $("paste-box").open = false; $("names-text").value = state.text;
  renderNames(); $("names-dlg").hidden = false;
});
$("paste-apply").addEventListener("click", () => { draft = parseNames($("names-text").value); $("paste-box").open = false; renderNames(); });
$("names-cancel").addEventListener("click", () => $("names-dlg").hidden = true);
$("names-save").addEventListener("click", () => { clean(); state.text = namesToText(draft); save(); $("names-dlg").hidden = true; render(); });

// 결과
$("open-results").addEventListener("click", () => {
  const box = $("results"); box.innerHTML = "";
  [1, 2].forEach(r => {
    const sec = document.createElement("section");
    const total = PRIZES.filter(p => p.round === r).reduce((s, p) => s + winnersOf(p.id).length, 0);
    sec.innerHTML = `<h3>${r}차 추첨 <small>${total}명</small></h3>`;
    PRIZES.filter(p => p.round === r).forEach(p => {
      const h = document.createElement("h4"); h.textContent = `${p.name} (${winnersOf(p.id).length}/${p.count})`;
      const d = document.createElement("div"); d.className = "names";
      d.textContent = winnersOf(p.id).join(" · ") || "아직 없어요";
      sec.append(h, d);
    });
    box.appendChild(sec);
  });
  $("results-dlg").hidden = false;
});
$("results-close").addEventListener("click", () => $("results-dlg").hidden = true);

// 되돌리기 / 처음부터 (페이지 안에서 확인)
let onYes = null;
function ask(title, body, yes) { $("confirm-h").textContent = title; $("confirm-p").textContent = body; onYes = yes; $("confirm-dlg").hidden = false; }
$("confirm-no").addEventListener("click", () => $("confirm-dlg").hidden = true);
$("confirm-yes").addEventListener("click", () => { $("confirm-dlg").hidden = true; onYes && onYes(); });
$("undo").addEventListener("click", () => {
  const last = state.log[state.log.length - 1]; if (!last) return;
  ask("마지막 당첨을 취소할까요?", `${prizeById(last.prize).name} · ${last.name}`, () => {
    state.log.pop(); state.winners[last.prize] = winnersOf(last.prize).filter((n, i, a) => !(n === last.name && i === a.lastIndexOf(last.name)));
    save(); $("callout").hidden = true; resetReel(); render();
  });
});
$("reset").addEventListener("click", () => ask("처음부터 다시 할까요?", "지금까지 뽑은 당첨자가 모두 지워져요. 명단은 그대로 남아요.", () => {
  state.winners = {}; state.log = []; state.round = 1; state.prize = "p1"; save(); $("callout").hidden = true; resetReel(); render();
}));
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".overlay").forEach(o => o.hidden = true); });

// ---------- 폭죽 ----------
const cf = $("confetti"), cx = cf.getContext("2d"); let parts = [], cfOn = false;
// 꽃가루: 처음에 '팡!' 터지고(약 2초) + 위에서 3.5초 동안 계속 흩날리며 내려옴 → 총 약 7초
const CF_COLS = ["#1E9E4A", "#F59E1B", "#FFC93C", "#7FD49A", "#2F6FD6", "#FFFFFF", "#FF8FA3"];
let rainUntil = 0, rainTimer = 0;
function confetti() {
  if (reduceMotion) return;
  const dpr = devicePixelRatio || 1; cf.width = innerWidth * dpr; cf.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (let i = 0; i < 160; i++) parts.push({ x: innerWidth * (.3 + Math.random() * .4), y: innerHeight * .35, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4, w: 7 + Math.random() * 7, h: 9 + Math.random() * 9, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: CF_COLS[i % CF_COLS.length], l: 0 });
  rainUntil = performance.now() + 3500;
  clearInterval(rainTimer);
  rainTimer = setInterval(() => {
    if (performance.now() > rainUntil) return clearInterval(rainTimer);
    for (let i = 0; i < 6; i++) parts.push({
      rain: true, x: Math.random() * innerWidth, y: -20 - Math.random() * 40,
      vx: (Math.random() - .5) * 1.2, vy: 2 + Math.random() * 1.5, sway: Math.random() * 6.28,
      w: 7 + Math.random() * 7, h: 9 + Math.random() * 9, r: Math.random() * 6, vr: (Math.random() - .5) * .2,
      c: CF_COLS[Math.floor(Math.random() * CF_COLS.length)], l: 0
    });
    if (!cfOn) { cfOn = true; requestAnimationFrame(stepCf); }
  }, 60);
  if (!cfOn) { cfOn = true; requestAnimationFrame(stepCf); }
}
function stepCf() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts.forEach(p => {
    if (p.rain) { p.vy = Math.min(p.vy + .02, 4.2); p.x += p.vx + Math.sin(p.sway + p.l / 18) * .9; }
    else { p.vy += .32; p.vx *= .99; p.x += p.vx; }
    p.y += p.vy; p.r += p.vr; p.l++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.l / 6))); cx.restore();
  });
  parts = parts.filter(p => p.y < innerHeight + 40 && p.l < 900);
  if (parts.length || performance.now() < rainUntil) requestAnimationFrame(stepCf); else { cfOn = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
}

load(); render();
addEventListener("resize", resizeWheel); resizeWheel();
document.fonts && document.fonts.ready.then(drawWheel);
</script>

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
